<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a101a">
  <title>Stickman Studio — Character Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261119-2">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brandmark" aria-hidden="true">S</div>
      <div class="brandcopy">
        <h1>استودیو استیکمن</h1>
        <p>Character Lab <span>نسخهٔ بازطراحی‌شده</span></p>
      </div>
      <div class="top-actions">
        <button class="topbtn" id="exportSvg" type="button" title="خروجی برداری">خروجی SVG</button>
        <button class="topbtn" id="savePng" type="button" title="ذخیرهٔ تصویر">PNG</button>
        <button class="topbtn quiet" id="fullscreen" type="button" title="تمام‌صفحه">تمام‌صفحه</button>
      </div>
    </header>

    <div class="workspace">
      <section class="stage-panel">
        <div class="stage-head">
          <div>
            <strong>پیش‌نمایش زنده</strong>
            <span id="motionLabel">ایستادن طبیعی</span>
          </div>
          <div class="stage-status"><i id="statusDot"></i><span id="statusText">تعادل برقرار است</span></div>
        </div>
        <div class="stage-wrap" id="stageWrap">
          <canvas id="stage" aria-label="پیش‌نمایش آدمک"></canvas>
          <div class="stage-tools">
            <button id="toggleJoints" class="stage-tool" type="button" aria-pressed="false">نمایش مفاصل</button>
            <button id="jump" class="stage-tool accent" type="button">پرش</button>
          </div>
          <div class="stage-tip">حرکت‌ها را از بخش «حرکت» انتخاب کن؛ تغییرات ظاهر و مفاصل فوراً اعمال می‌شوند.</div>
        </div>
        <div class="stage-footer">
          <span>تماس پا با زمین: <b>فعال</b></span>
          <span>حل مفاصل: <b>IK دو‌بخشی</b></span>
          <span>تعادل بدن: <b id="balanceState">فعال</b></span>
        </div>
      </section>

      <aside class="editor-panel">
        <nav class="tabs" aria-label="بخش‌های ویرایش">
          <button class="tab active" data-tab="design" type="button"><span>◈</span> ظاهر</button>
          <button class="tab" data-tab="pose" type="button"><span>⌘</span> مفاصل</button>
          <button class="tab" data-tab="motion" type="button"><span>▶</span> حرکت</button>
          <button class="tab" data-tab="physics" type="button"><span>◎</span> فیزیک</button>
        </nav>
        <div class="editor-scroll" id="editorContent"></div>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="physics.js?v=20261119-2" defer></script>
  <script src="rig.js?v=20261119-2" defer></script>
  <script src="app.js?v=20261119-2" defer></script>
</body>
</html>
